# Runs on every push and pull request: each frozen release still matches its
# own checksums. Standard library only, one short job, no schedule.
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Every release matches its SHA256SUMS and manifest
        run: python3 scripts/verify.py
